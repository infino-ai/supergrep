name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

# The recall report ran here until the benchmark harness left this repository
# for the one that owns the demo. It was report-only — hit@5 / MRR@5 printed to
# the log, never failing the build — so what is lost is a log line rather than a
# gate. The measurement still runs where `bench/` now lives.

<svg xmlns='http://www.w3.org/2000/svg' width='960' height='470' viewBox='0 0 960 470' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif'>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#57606a'/></marker></defs>
<rect width='960' height='470' fill='#ffffff'/>
<rect x='30' y='175' width='190' height='120' rx='10' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='125' y='213' fill='#24292f' font-size='18' font-weight='600' text-anchor='middle'>your agent</text>
<text x='125' y='237' fill='#57606a' font-size='13' text-anchor='middle'>keeps the reasoning,</text>
<text x='125' y='255' fill='#57606a' font-size='13' text-anchor='middle'>decides when to delegate</text>
<rect x='330' y='30' width='600' height='150' rx='10' fill='#ffffff' stroke='#2f81f7' stroke-width='1.5'/>
<text x='350' y='58' fill='#2f81f7' font-size='12' font-weight='600'>YOUR MACHINE</text>
<text x='350' y='90' fill='#24292f' font-size='17' font-weight='600'>find</text>
<text x='350' y='109' fill='#57606a' font-size='13'>every line holding an exact string, with the counts</text>
<text x='350' y='137' fill='#24292f' font-size='17' font-weight='600'>sql</text>
<text x='350' y='156' fill='#57606a' font-size='13'>plain SQL over the index: counts, rankings, sizes</text>
<rect x='680' y='75' width='230' height='64' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='795' y='100' fill='#24292f' font-size='13' font-weight='600' text-anchor='middle'>keyword index</text>
<text x='795' y='120' fill='#57606a' font-size='12' text-anchor='middle'>plain files in .infino/</text>
<rect x='330' y='215' width='600' height='225' rx='10' fill='#ffffff' stroke='#2da44e' stroke-width='1.5'/>
<text x='350' y='243' fill='#2da44e' font-size='12' font-weight='600'>INFINO CLOUD</text>
<text x='350' y='275' fill='#24292f' font-size='17' font-weight='600'>search</text>
<text x='350' y='294' fill='#57606a' font-size='13'>keywords and meaning, one ranked pass</text>
<text x='350' y='322' fill='#24292f' font-size='17' font-weight='600'>sql with a ranked search in it</text>
<text x='350' y='341' fill='#57606a' font-size='13'>“which files have the most code about X”</text>
<text x='350' y='369' fill='#24292f' font-size='17' font-weight='600'>ask</text>
<text x='350' y='388' fill='#57606a' font-size='13'>a question that spans the repository, returned</text>
<text x='350' y='406' fill='#57606a' font-size='13'>as the rows it found rather than as prose</text>
<rect x='680' y='250' width='230' height='52' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='795' y='272' fill='#24292f' font-size='13' font-weight='600' text-anchor='middle'>every embedding</text>
<text x='795' y='290' fill='#57606a' font-size='12' text-anchor='middle'>computed here, never on your laptop</text>
<rect x='680' y='312' width='230' height='52' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='795' y='334' fill='#24292f' font-size='13' font-weight='600' text-anchor='middle'>small models</text>
<text x='795' y='352' fill='#57606a' font-size='12' text-anchor='middle'>many at once, behind ask</text>
<rect x='680' y='374' width='230' height='52' rx='8' fill='#f6f8fa' stroke='#d0d7de'/>
<text x='795' y='396' fill='#24292f' font-size='13' font-weight='600' text-anchor='middle'>the same index</text>
<text x='795' y='414' fill='#57606a' font-size='12' text-anchor='middle'>search on object storage</text>
<path d='M 220 215 C 275 215, 285 105, 330 105' fill='none' stroke='#57606a' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='322' y='92' fill='#57606a' font-size='12' text-anchor='end'>exact strings, plain SQL</text>
<path d='M 220 255 C 275 255, 285 330, 330 330' fill='none' stroke='#57606a' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='322' y='352' fill='#57606a' font-size='12' text-anchor='end'>anything with meaning in it</text>
<path d='M 795 139 L 795 250' fill='none' stroke='#8b949e' stroke-width='1.5' stroke-dasharray='5 4'/>
<rect x='690' y='184' width='210' height='22' rx='4' fill='#ffffff'/>
<text x='795' y='200' fill='#57606a' font-size='12' text-anchor='middle'>one index, kept in both places</text>
</svg>

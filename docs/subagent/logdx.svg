<svg xmlns='http://www.w3.org/2000/svg' width='960' height='291' viewBox='0 0 960 291' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='960' height='291' fill='#ffffff'/>
<text x='20' y='30' fill='#24292f' font-size='18' font-weight='600'>LogDx-CI: diagnosing 35 CI failures from their logs</text>
<text x='20' y='50' fill='#57606a' font-size='12'>A public benchmark of log reduction: each method cuts the log down, the same model diagnoses from what is left, and the benchmark's judge scores it.</text>
<text x='20' y='65' fill='#57606a' font-size='12'>The other methods and their numbers are the benchmark's own. SuperGrep ranks the log's windows and keeps only the lines carrying the query's terms.</text>
<text x='20' y='95' fill='#24292f' font-size='13' font-weight='600'>Diagnosis score, higher is better</text>
<text x='20' y='126' fill='#24292f' font-size='13' font-weight='600'>hybrid grep + tail</text>
<rect x='195' y='111' width='155' height='18' rx='3' fill='#8b949e'/>
